name: cbl-connector
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbl
      POSTGRES_PASSWORD: cbl
      POSTGRES_DB: connector
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbl -d connector"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cbl-net]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["9092:9092"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward_transitive
    ports: ["8081:8081"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in gateway.webhooks.raw gateway.webhooks.raw.retry.5s gateway.webhooks.raw.retry.1m gateway.webhooks.raw.retry.10m gateway.webhooks.raw.dlq gateway.events.canonical gateway.events.canonical.retry.5s gateway.events.canonical.retry.1m gateway.events.canonical.retry.10m gateway.events.canonical.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    networks: [cbl-net]

  mock-gateway:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: cbl-mock-gateway/Dockerfile
    environment:
      HTTP_ADDR: ":8120"
      METRICS_ADDR: ":9320"
      # The stand webhook target is unused by the adapter scenario (the
      # simulate delivery may end as a recorded network error, which is fine).
      WEBHOOK_TARGET_URL: "http://connector:8050/hooks/mock/ep1"
    ports: ["8120:8120"]
    networks: [cbl-net]

  connector:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: cbl-connector/Dockerfile
    environment:
      HTTP_ADDR: ":8050"
      GRPC_ADDR: ":9050"
      METRICS_ADDR: ":9250"
      PG_DSN: postgres://cbl:cbl@postgres:5432/connector?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_CONSUMER_GROUP: cbl-connector-webhooks
      CONNECTOR_SANDBOX_PROVIDERS: mock
      REDIS_ADDR: redis:6379
      # Optional provider allowlist (CSV): the e2e scenarios select one provider;
      # empty means every provider with a configured base URL is enabled.
      CONNECTOR_PROVIDERS: ${CONNECTOR_PROVIDERS-}
      # Stand-only placeholders: production injects the adapter values from
      # Vault (the manifests declare the secret paths). The provider scenarios
      # select adapters through the CONNECTOR_PROVIDERS allowlist.
      CONNECTOR_BTCPAY_BASE_URL: ${CONNECTOR_BTCPAY_BASE_URL-http://mock-gateway:8120}
      CONNECTOR_BTCPAY_STORE_ID: mock-store
      CONNECTOR_BTCPAY_API_TOKEN: mock-token
      CONNECTOR_BTCPAY_WEBHOOK_SECRET: mock-btcpay-secret
      CONNECTOR_BTCPAY_CAPABILITIES: '[{"network":"btc","asset":"BTC","min_minor":10000,"decimals":8,"confirmations":2}]'
      CONNECTOR_BITPAY_BASE_URL: ${CONNECTOR_BITPAY_BASE_URL-}
      CONNECTOR_BITPAY_API_TOKEN: ${CONNECTOR_BITPAY_API_TOKEN-}
      CONNECTOR_BITPAY_PRIVATE_KEY_PEM: ${CONNECTOR_BITPAY_PRIVATE_KEY_PEM-}
      CONNECTOR_BITPAY_WEBHOOK_SECRET: ${CONNECTOR_BITPAY_WEBHOOK_SECRET-}
      CONNECTOR_BITPAY_WEBHOOK_URL: ${CONNECTOR_BITPAY_WEBHOOK_URL-}
      CONNECTOR_BITPAY_CAPABILITIES: ${CONNECTOR_BITPAY_CAPABILITIES-}
      CONNECTOR_COINGATE_BASE_URL: ${CONNECTOR_COINGATE_BASE_URL-}
      CONNECTOR_COINGATE_API_TOKEN: ${CONNECTOR_COINGATE_API_TOKEN-}
      CONNECTOR_COINGATE_IPN_TOKEN: ${CONNECTOR_COINGATE_IPN_TOKEN-}
      CONNECTOR_COINGATE_CAPABILITIES: ${CONNECTOR_COINGATE_CAPABILITIES-}
      CONNECTOR_NOWPAYMENTS_BASE_URL: ${CONNECTOR_NOWPAYMENTS_BASE_URL-}
      CONNECTOR_NOWPAYMENTS_API_KEY: ${CONNECTOR_NOWPAYMENTS_API_KEY-}
      CONNECTOR_NOWPAYMENTS_IPN_SECRET: ${CONNECTOR_NOWPAYMENTS_IPN_SECRET-}
      CONNECTOR_NOWPAYMENTS_CAPABILITIES: ${CONNECTOR_NOWPAYMENTS_CAPABILITIES-}
    ports:
      - "8050:8050"
      - "9050:9050"
      - "9250:9250"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    networks: [cbl-net]

volumes:
  pg-data:
  redis-data:
  kafka-data:

networks:
  cbl-net:
    driver: bridge
